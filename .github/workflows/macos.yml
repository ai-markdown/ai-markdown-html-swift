name: macOS Swift



on:
  workflow_dispatch:
  push:
    branches: [ "master", "ai-markdown" ]
  pull_request:
    branches: [ "master", "ai-markdown", "fix/**" ]

jobs:
  build:
    name: Swift on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-26]
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Print Swift version
      run: swift --version
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Run release package tests
      run: swift test -c release
    - name: Verify current source manifest
      run: python3 scripts/verify-source.py
