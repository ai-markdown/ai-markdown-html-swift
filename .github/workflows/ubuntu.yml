name: Ubuntu Swift



on:
  workflow_dispatch:
  push:
    branches: [ "master", "ai-markdown" ]
  pull_request:
    branches: [ "master", "ai-markdown", "fix/**" ]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        swift: ["6.2"]
        
    runs-on: ${{ matrix.os }}

    container: 
      image: swift:${{ matrix.swift }}

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Replay fixed Web hibernation checkpoint controls
      run: node scripts/hibernation-checkpoint-oracle/export.mjs --check
    - name: Verify current source and evidence manifests
      run: python3 scripts/verify-source.py
